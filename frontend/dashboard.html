<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Dept Hub</h2>
    <h3 id="welcome"></h3>
<button onclick="logout()"class="logout-btn">Logout</button>
<button onclick="refreshPosts(this)">Refresh</button>
  </div>

  <!-- Main -->
  <div class="main">

    <h2>Create Post</h2>
    <input id="title" placeholder="Title">
    <textarea id="content" placeholder="Write something..."></textarea>
    <button class="btn" onclick="createPost()">Post</button>
    <button class="btn" onclick="clearInputs()">Clear</button>

    <h2>Announcements</h2>
    <div id="posts"></div>

  </div>

</div>
<div id="toast" class="toast"></div>
<script src="script.js"></script>
</body>
</html>
